# Tool configuration only. This project is not distributed as a package, so
# there is deliberately no [project] table.

[tool.ruff]
target-version = "py311"
# Documentation only: E501 is NOT selected below. Enforcing line length would
# require reformatting pipeline code under src/, which is out of scope.
line-length = 120
exclude = [".venv", "data", ".git"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
